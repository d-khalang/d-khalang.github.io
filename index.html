<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Portfolio...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f6f9;
    }
    .redirect-box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 400px;
    }
    h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
    p { color: #666; font-size: 16px; margin-bottom: 25px; }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    setTimeout(function() {
      window.location.href = "https://d-khalang.github.io/portfolio";
    }, 1500);
  </script>
</head>
<body>
  <div class="redirect-box">
    <h1>Moving to Portfolio</h1>
    <p>We are redirecting you to the new site. Hold on just a second...</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
